name: Reporte diario

on:
  schedule:
    # 4 veces por día (hora de Argentina = UTC-3):
    - cron: "15 0 * * *"          # 21:15 ARG, apenas cierra la vela diaria
    - cron: "0 12,16,20 * * *"    # 09:00, 13:00 y 17:00 ARG
  workflow_dispatch: {}     # botón "Run workflow" para correrlo a mano

permissions:
  contents: write   # guardar el histórico (datos/cripto.db) en el repositorio
  pages: write
  id-token: write

concurrency:
  group: reporte-diario
  cancel-in-progress: false

jobs:
  reporte:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar reporte
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          COINMARKETCAL_API_KEY: ${{ secrets.COINMARKETCAL_API_KEY }}
        run: python run.py --no-abrir --sitio

      - name: Guardar histórico
        run: |
          git config user.name "reporte-diario[bot]"
          git config user.email "reporte-diario@users.noreply.github.com"
          git add datos/ reportes/*.html
          git diff --cached --quiet || git commit -m "Reporte $(date -u '+%F %H:%M') UTC"
          git pull --rebase -q origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reportes
      - id: deploy
        uses: actions/deploy-pages@v4
