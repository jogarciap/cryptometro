name: Noticias

# Junta noticias y comentarios sobre el top 10 cada 10 minutos y los deja en la rama "noticias"
# (un solo archivo, noticias.json). La página los lee de ahí, así no hace falta volver a publicar
# el sitio ni llenar el historial de main con commits.
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub puede demorar unos minutos los flujos programados
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q "requests>=2.31"

      - name: Juntar noticias del top 10
        run: python noticias.py --salida salida/noticias.json

      - name: Publicar en la rama noticias
        working-directory: salida
        run: |
          git init -q -b noticias
          git config user.name "noticias[bot]"
          git config user.email "noticias@users.noreply.github.com"
          git add noticias.json
          git commit -q -m "Noticias $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" noticias
